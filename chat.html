<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المحادثة الفورية</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif; background:#f0f2f5; color:#1e293b; height:100vh; overflow:hidden; -webkit-overflow-scrolling:touch; }
    .login-overlay { position:fixed; top:0; right:0; bottom:0; left:0; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .login-overlay.hidden { display:none; }
    .login-card { background:#fff; border-radius:24px; padding:36px 28px; width:380px; max-width:92vw; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.3); }
    .login-logo { width:72px; height:72px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:22px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px; }
    .login-card h1 { font-size:24px; font-weight:800; margin-bottom:6px; }
    .login-card p { color:#64748b; margin-bottom:24px; font-size:15px; }
    .login-input-group { position:relative; margin-bottom:14px; text-align:right; }
    .login-input-group input { width:100%; padding:14px 18px 14px 46px; border:2px solid #e2e8f0; border-radius:10px; font-size:16px; font-family:'Tajawal',sans-serif; outline:none; text-align:right; direction:rtl; }
    .login-input-group input:focus { border-color:#6366f1; }
    .login-input-group input.dir-ltr { text-align:left; direction:ltr; }
    .login-input-group .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:18px; color:#94a3b8; }
    .login-input-group .hint { font-size:12px; color:#94a3b8; margin-top:5px; text-align:right; }
    .login-btn { width:100%; padding:14px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:10px; font-size:17px; font-weight:700; font-family:'Tajawal',sans-serif; cursor:pointer; margin-top:6px; }
    .login-btn:disabled { opacity:0.6; }
    .login-error { color:#ef4444; font-size:13px; margin-top:10px; display:none; }
    .app-container { display:none; height:100vh; flex-direction:column; }
    .app-container.active { display:flex; }
    .chat-header { background:#fff; padding:12px 16px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; }
    .chat-header .room-info { display:flex; align-items:center; gap:10px; }
    .chat-header .room-icon { width:38px; height:38px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; }
    .chat-header .room-name { font-weight:700; font-size:15px; }
    .chat-header .room-desc { font-size:12px; color:#64748b; }
    .online-badge { background:#10b981; color:#fff; font-size:11px; font-weight:700; padding:4px 10px; border-radius:50px; display:flex; align-items:center; gap:4px; }
    .users-bar { background:#fff; padding:8px 12px; border-bottom:1px solid #e2e8f0; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; display:flex; gap:8px; align-items:center; }
    .users-bar::-webkit-scrollbar { display:none; }
    .users-bar-label { font-size:12px; color:#94a3b8; font-weight:600; flex-shrink:0; }
    .user-chip { display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 5px; background:#f0f2f5; border-radius:50px; font-size:12px; font-weight:600; flex-shrink:0; }
    .user-chip .mini-avatar { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; }
    .user-chip.me { background:rgba(99,102,241,0.12); color:#4f46e5; }
    .messages-container { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:6px; -webkit-overflow-scrolling:touch; background:#f0f2f5; }
    .messages-container::-webkit-scrollbar { width:3px; }
    .messages-container::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }
    .message-wrapper { display:flex; align-items:flex-end; gap:8px; max-width:78%; }
    .message-wrapper.me { align-self:flex-start; flex-direction:row-reverse; }
    .message-wrapper.other { align-self:flex-end; }
    .msg-avatar { width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex-shrink:0; }
    .message-bubble { padding:10px 14px; border-radius:16px; line-height:1.55; font-size:15px; word-wrap:break-word; overflow-wrap:break-word; }
    .message-wrapper.me .message-bubble { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border-bottom-left-radius:5px; }
    .message-wrapper.other .message-bubble { background:#f1f5f9; color:#1e293b; border-bottom-right-radius:5px; }
    .msg-sender { font-size:11px; font-weight:700; margin-bottom:2px; color:#6366f1; }
    .msg-time { font-size:10px; opacity:0.55; margin-top:3px; }
    .message-wrapper.me .msg-time { text-align:right; color:rgba(255,255,255,0.65); }
    .system-msg { text-align:center; padding:5px 0; }
    .system-msg span { background:#fff; color:#64748b; font-size:12px; padding:3px 12px; border-radius:50px; }
    .typing-indicator { display:none; align-items:center; gap:7px; padding:5px 14px; font-size:13px; color:#64748b; background:#fff; }
    .typing-indicator.active { display:flex; }
    .typing-dots { display:flex; gap:3px; }
    .typing-dots span { width:6px; height:6px; background:#94a3b8; border-radius:50%; }
    .offline-banner { display:none; background:#f59e0b; color:#fff; text-align:center; padding:5px; font-size:13px; font-weight:600; }
    .offline-banner.active { display:block; }
    .emoji-picker { display:none; position:absolute; bottom:68px; right:12px; left:12px; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:10px; z-index:100; max-height:200px; overflow-y:auto; }
    .emoji-picker.active { display:block; }
    .emoji-grid { display:flex; flex-wrap:wrap; gap:2px; }
    .emoji-grid button { width:12.5%; border:none; background:none; font-size:20px; cursor:pointer; border-radius:8px; padding:6px 0; }
    .chat-input-area { padding:8px 10px 14px; background:#fff; border-top:1px solid #e2e8f0; position:relative; }
    .input-wrapper { display:flex; align-items:center; gap:6px; background:#f0f2f5; border:2px solid #e2e8f0; border-radius:16px; padding:3px 3px 3px 10px; }
    .input-wrapper:focus-within { border-color:#6366f1; }
    .emoji-btn,.send-btn { border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .emoji-btn { background:none; font-size:20px; padding:8px; border-radius:10px; color:#64748b; }
    .send-btn { width:40px; height:40px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border-radius:12px; font-size:17px; }
    .chat-input { flex:1; border:none; background:transparent; font-size:16px; font-family:'Tajawal',sans-serif; outline:none; padding:8px 4px; text-align:right; color:#1e293b; min-width:0; }
    .chat-input::placeholder { color:#94a3b8; }
    .scroll-bottom-btn { display:none; position:absolute; bottom:68px; left:14px; width:34px; height:34px; background:#fff; border:1px solid #e2e8f0; border-radius:50%; cursor:pointer; font-size:16px; z-index:50; color:#64748b; }
    .scroll-bottom-btn.visible { display:flex; }
    .status-bar { display:flex; align-items:center; justify-content:space-between; padding:5px 12px; background:#fff; border-top:1px solid #e2e8f0; font-size:11px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-logo">💬</div>
      <h1>المحادثة الفورية</h1>
      <p>اتصل بغرفة المحادثة وأبدأ التحدث</p>
      <div class="login-input-group">
        <input type="text" id="usernameInput" placeholder="اسمك..." maxlength="20" autocomplete="off">
        <span class="input-icon">👤</span>
      </div>

      <button class="login-btn" id="loginBtn">دخول إلى المحادثة</button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>
  <div class="app-container" id="appContainer">
    <div class="offline-banner" id="offlineBanner">غير متصل — يتم إعادة الاتصال...</div>
    <div class="chat-header">
      <div class="room-info">
        <div class="room-icon">🌐</div>
        <div>
          <div class="room-name">الغرفة العامة</div>
          <div class="room-desc" id="serverDisplay">محادثة جماعية فورية</div>
        </div>
      </div>
      <span class="online-badge" id="onlineCount">0</span>
    </div>
    <div class="users-bar" id="usersBar"><span class="users-bar-label">المتصلون:</span></div>
    <div class="messages-container" id="messagesContainer"></div>
    <button class="scroll-bottom-btn" id="scrollBtn">↓</button>
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span id="typingText">أحد يكتب...</span>
    </div>
    <div class="emoji-picker" id="emojiPicker"><div class="emoji-grid" id="emojiGrid"></div></div>
    <div class="chat-input-area">
      <div class="input-wrapper">
        <button class="emoji-btn" id="emojiBtn">😊</button>
        <input type="text" class="chat-input" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off">
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
    <div class="status-bar">
      <span id="connectionStatus">متصل</span>
      <span id="myNameStatus"></span>
    </div>
  </div>
  <script>
    var ws=null,currentUser=null,myUserId='',onlineUsers=[],typingTimeout=null,isAtBottom=true,serverAddr='',reconnectTimer=null,waitInterval=null,loginStartTime=0,appVisible=true,audioCtx=null,isMobile=false;
    (function(){var u=navigator.userAgent||'';if(u.match(/Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i))isMobile=true;})();

    function initAudio(){
      try{
        if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended')audioCtx.resume();
      }catch(e){}
    }

    function playBeep(){
      try{
        initAudio();
        if(!audioCtx)return;
        var osc=audioCtx.createOscillator();
        var gain=audioCtx.createGain();
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.frequency.value=880;osc.type='sine';
        gain.gain.value=0.3;
        osc.start();gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
        osc.stop(audioCtx.currentTime+0.3);
        setTimeout(function(){
          var osc2=audioCtx.createOscillator();
          var gain2=audioCtx.createGain();
          osc2.connect(gain2);gain2.connect(audioCtx.destination);
          osc2.frequency.value=1100;osc2.type='sine';
          gain2.gain.value=0.3;
          osc2.start();gain2.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);
          osc2.stop(audioCtx.currentTime+0.2);
        },150);
      }catch(e){}
    }

    function playJoinSound(){
      try{
        initAudio();
        if(!audioCtx)return;
        var osc=audioCtx.createOscillator();
        var gain=audioCtx.createGain();
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.frequency.value=660;osc.type='sine';
        gain.gain.value=0.2;
        osc.start();gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
        osc.stop(audioCtx.currentTime+0.15);
      }catch(e){}
    }

    var emojis=['😀','😂','🤣','😊','😍','😘','😎','🤩','😇','🤔','🤗','😅','😢','😤','🥺','😱','👍','👎','👋','✋','🤝','👏','🙌','💪','❤️','🔥','⭐','🎉','🎊','💯','✅','❌','⚡','🌟','🌈','☀️','🌙','🍀','🌸','🎵','📱','💻','☕','🍕','🍔','🎂','🏆','🎯','📚','🏠'];
    var eg=document.getElementById('emojiGrid');
    for(var i=0;i<emojis.length;i++){(function(e){var b=document.createElement('button');b.textContent=e;b.onclick=function(){document.getElementById('messageInput').value+=e;document.getElementById('messageInput').focus();};eg.appendChild(b);})(emojis[i]);}
    var lastUser='',lastServer='';
    try{lastUser=localStorage.getItem('chat_user')||'';}catch(e){}
    try{lastServer=localStorage.getItem('chat_server')||'';}catch(e){}
    if(lastUser)document.getElementById('usernameInput').value=lastUser;
    /* server address is hardcoded */
    document.addEventListener('visibilitychange',function(){appVisible=!document.hidden;});
    document.getElementById('loginBtn').addEventListener('click',login);
    document.getElementById('sendBtn').addEventListener('click',sendMessage);
    document.getElementById('scrollBtn').addEventListener('click',scrollToBottom);
    document.getElementById('emojiBtn').addEventListener('click',function(){var p=document.getElementById('emojiPicker');p.style.display=p.style.display==='block'?'none':'block';});
    document.getElementById('usernameInput').addEventListener('keydown',function(e){if(e.keyCode===13)login();});
    document.getElementById('messageInput').addEventListener('keydown',function(e){if(e.keyCode===13){e.preventDefault();sendMessage();}handleTyping();});
    document.getElementById('usernameInput').focus();

    function login(){
      initAudio();
      if('Notification' in window && Notification.permission==='default'){
        Notification.requestPermission();
      }
      var name=document.getElementById('usernameInput').value.trim();
      var srv='instant-chat-xbmk.onrender.com';
      var errEl=document.getElementById('loginError');
      if(!name){errEl.textContent='أدخل اسمك';errEl.style.display='block';return;}
      errEl.style.display='none';
      serverAddr=srv;
      try{localStorage.setItem('chat_user',name);}catch(e){}
      try{localStorage.setItem('chat_server',srv);}catch(e){}
      currentUser={name:name,color:'#6366f1',avatar:name.charAt(0).toUpperCase()};
      document.getElementById('loginBtn').disabled=true;
      document.getElementById('loginBtn').textContent='جاري الاتصال...';
      connectWS(srv,name);
    }

    function connectWS(srv,name){
      if(ws){try{ws.close();}catch(e){}}
      if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
      if(waitInterval){clearInterval(waitInterval);waitInterval=null;}
      loginStartTime=Date.now();
      waitInterval=setInterval(function(){
        var elapsed=Math.floor((Date.now()-loginStartTime)/1000);
        if(ws&&ws.readyState===1){clearInterval(waitInterval);waitInterval=null;return;}
        document.getElementById('loginBtn').textContent='جاري الاتصال... '+elapsed+' ثانية';
      },1000);
      var url='wss://'+srv;
      try{ws=new WebSocket(url);}catch(e){showErr('خطأ في الاتصال');return;}
      ws.onopen=function(){
        document.getElementById('offlineBanner').className='offline-banner';
        document.getElementById('connectionStatus').textContent='متصل ✓';
        ws.send(JSON.stringify({type:'login',name:name}));
      };
      ws.onmessage=function(evt){
        var data;try{data=JSON.parse(evt.data);}catch(e){return;}
        handleMessage(data);
      };
      ws.onclose=function(){
        document.getElementById('offlineBanner').className='offline-banner active';
        document.getElementById('connectionStatus').textContent='غير متصل ✗';
        if(currentUser&&serverAddr){reconnectTimer=setTimeout(function(){connectWS(serverAddr,currentUser.name);},3000);}
      };
      ws.onerror=function(){
        document.getElementById('offlineBanner').className='offline-banner active';
        document.getElementById('connectionStatus').textContent='غير متصل ✗';
      };
      setTimeout(function(){
        if(waitInterval){clearInterval(waitInterval);waitInterval=null;}
        if(!ws||ws.readyState!==1){showErr('فشل الاتصال — تأكد من العنوان والإنترنت');}
      },60000);
    }

    function showErr(msg){
      var errEl=document.getElementById('loginError');
      errEl.textContent=msg;errEl.style.display='block';
      document.getElementById('loginBtn').disabled=false;
      document.getElementById('loginBtn').textContent='دخول إلى المحادثة';
    }

    function handleMessage(data){
      if(data.type==='your_info'){
        currentUser=data.user;myUserId=data.user.id;
        document.getElementById('serverDisplay').textContent=serverAddr;
        document.getElementById('myNameStatus').textContent=currentUser.name;
        showApp();
      }
      else if(data.type==='previous_messages'){
        var msgs=data.messages;
        for(var i=0;i<msgs.length;i++)addMessage(msgs[i],false);
        scrollToBottom();
      }
      else if(data.type==='online_users'){onlineUsers=data;renderUsers();}
      else if(data.type==='user_joined'){
        onlineUsers=data.onlineUsers;renderUsers();
        addSystemMsg(data.user.name+' انضم');
        if(isMobile) playJoinSound();
      }
      else if(data.type==='user_left'){
        onlineUsers=data.onlineUsers;renderUsers();
        addSystemMsg(data.username+' غادر');
      }
      else if(data.type==='new_message'){
        var isMyMsg=(data.message.userId===myUserId)||(data.message.username===(currentUser&&currentUser.name));
        addMessage(data.message,true);
        if(isMobile){
          if(!isMyMsg) playBeep();
        } else {
          if(!appVisible) playBeep();
        }
      }
      else if(data.type==='user_typing'){
        if(data.username!==(currentUser&&currentUser.name)){
          document.getElementById('typingText').textContent=data.username+' يكتب...';
          document.getElementById('typingIndicator').className='typing-indicator active';
          clearTimeout(typingTimeout);
          typingTimeout=setTimeout(function(){document.getElementById('typingIndicator').className='typing-indicator';},2500);
        }
      }
      else if(data.type==='user_stopped_typing'){document.getElementById('typingIndicator').className='typing-indicator';}
    }

    function showApp(){
      document.getElementById('loginOverlay').className='login-overlay hidden';
      document.getElementById('appContainer').className='app-container active';
      if(waitInterval){clearInterval(waitInterval);waitInterval=null;}
      document.getElementById('messageInput').focus();
    }

    function sendMessage(){
      var input=document.getElementById('messageInput');
      var text=input.value.trim();
      if(!text||!ws||ws.readyState!==1)return;
      ws.send(JSON.stringify({type:'send_message',text:text}));
      input.value='';input.focus();
      ws.send(JSON.stringify({type:'stop_typing'}));
      document.getElementById('emojiPicker').style.display='none';
    }

    var typingTimer=null;
    function handleTyping(){
      if(!ws||ws.readyState!==1)return;
      ws.send(JSON.stringify({type:'typing'}));
      clearTimeout(typingTimer);
      typingTimer=setTimeout(function(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'stop_typing'}));},1500);
    }

    function addMessage(msg,animate){
      var c=document.getElementById('messagesContainer');
      var isMe=(msg.userId===myUserId)||(msg.username===(currentUser&&currentUser.name));
      var mid=String(msg.id);
      var allW=c.children;for(var i=0;i<allW.length;i++){if(allW[i].getAttribute('data-mid')===mid)return;}
      var w=document.createElement('div');
      w.className='message-wrapper '+(isMe?'me':'other');
      w.setAttribute('data-mid',mid);
      var color=msg.color||'#6366f1';
      var avatar=msg.avatar||msg.username.charAt(0).toUpperCase();
      var senderHtml=isMe?'':'<div class="msg-sender">'+msg.username+'</div>';
      w.innerHTML='<div class="msg-avatar" style="background:'+color+'">'+avatar+'</div>'+
        '<div><div class="message-bubble">'+senderHtml+
        '<div>'+escapeHtml(msg.text)+'</div>'+
        '<div class="msg-time">'+msg.time+'</div>'+
        '</div></div>';
      c.appendChild(w);
      if(isAtBottom)scrollToBottom();
    }

    function addSystemMsg(text){
      var c=document.getElementById('messagesContainer');
      var d=document.createElement('div');d.className='system-msg';
      d.innerHTML='<span>'+text+'</span>';c.appendChild(d);
      if(isAtBottom)scrollToBottom();
    }

    function escapeHtml(text){var d=document.createElement('div');d.textContent=text;return d.innerHTML;}

    function renderUsers(){
      var bar=document.getElementById('usersBar');
      document.getElementById('onlineCount').textContent=onlineUsers.length;
      var html='<span class="users-bar-label">المتصلون:</span>';
      for(var i=0;i<onlineUsers.length;i++){
        var u=onlineUsers[i];var isMe=u.id===myUserId;
        html+='<div class="user-chip '+(isMe?'me':'')+'">'+
          '<span class="mini-avatar" style="background:'+u.color+'">'+u.avatar+'</span>'+
          u.name+'</div>';
      }
      bar.innerHTML=html;
    }

    var mc=document.getElementById('messagesContainer');
    mc.addEventListener('scroll',function(){
      isAtBottom=(mc.scrollHeight-mc.scrollTop-mc.clientHeight)<100;
      var btn=document.getElementById('scrollBtn');
      btn.className=isAtBottom?'scroll-bottom-btn':'scroll-bottom-btn visible';
    });
    function scrollToBottom(){mc.scrollTop=mc.scrollHeight;isAtBottom=true;}
  </script>
</body>
</html>
